
name: better_routes
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Application version
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Application dependencies
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  firebase_auth: 6.7.1
  firebase_core: 4.15.1
  cloud_firestore: ^6.1.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  geolocator: ^14.1.2
  latlong2: ^0.10.1
  maplibre_gl: ^0.27.1
  share_plus: ^13.3.1

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Resolve archive package compatibility
dependency_overrides:
  archive: ^4.4.0

# Better Routes Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/BetterRoutes.png"
  min_sdk_android: 21

# Flutter configuration
flutter:
  uses-material-design: true

  # Application assets
  assets:
    - assets/images/BetterRoutes.png
